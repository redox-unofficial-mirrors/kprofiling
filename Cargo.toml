[package]
name = "redox-kprofiling"
version = "0.2.1"
edition = "2024"
authors = ["4lDO2 <4lDO2@protonmail.com>"]
license = "MIT"
repository = "https://gitlab.redox-os.org/redox-os/kprofiling"
description = "Conversion tool from Redox kernel profiling data into perf script."
categories = ["development-tools::profiling", "command-line-utilities"]
keywords = ["redox", "kernel", "profiling", "perf"]
readme = "README.md"

[dependencies]
anyhow = "1"
proc-macro2 = "1.0.107"
syn = { version = "3.0.3", features = ["extra-traits"] }
